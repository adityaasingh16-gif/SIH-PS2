[project]
name = "sih26074-agromet"
version = "1.5.0"
description = "Terrain-aware Panchayat weather downscaling and agrometeorological advisories"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "geopandas>=1.0,<2",
    "joblib>=1.4,<2",
    "lightgbm>=4.5,<5",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pydantic>=2.8,<3",
    "rasterio>=1.3,<2",
    "scikit-learn>=1.4,<2",
    "scipy>=1.13,<2",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
