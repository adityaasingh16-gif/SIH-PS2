services:
  - type: web
    name: sih-ps2-agromet
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: "8000"
      - key: AGROMET_DB_PATH
        value: "/app/data/agromet.sqlite3"
      - key: AGROMET_PANCHAYATS_FILE
        value: "/app/config/panchayats.mock.json"
      - key: AGROMET_MODEL_ARTIFACT
        value: "/app/agromet/models/m1-telangana-mock-v1/model_bundle.joblib"
      - key: AGROMET_SESSION_SECRET
        generateValue: true
      - key: AGROMET_BOOTSTRAP_ADMIN_EMAIL
        value: "admin@agromet.demo"
      - key: AGROMET_BOOTSTRAP_ADMIN_PASSWORD
        value: "AdminDemo@2026!"
      - key: AGROMET_PUBLIC_BASE_URL
        value: "https://sih-ps2-agromet.onrender.com"
      - key: AGROMET_DEMO_MODE
        value: "true"
      - key: AGROMET_FORECAST_PROVIDER
        value: "open_meteo"
      - key: AGROMET_OPEN_METEO_URL
        value: "https://api.open-meteo.com/v1/forecast"
